name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository root:"
          pwd
          ls -la
          echo "Workflow path:"
          ls -la .github/workflows
          echo "Required files:"
          for f in package.json index.html main.js capacitor.config.json; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done
          for d in www assets; do
            if [ -d "$d" ]; then
              echo "FOUND folder: $d"
            else
              echo "MISSING folder: $d"
            fi
          done
