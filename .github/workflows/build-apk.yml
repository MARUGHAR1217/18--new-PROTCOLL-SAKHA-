
name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f capacitor.config.json
          test -f native-shim.js
          test -f native-plugins-entry.js
          test -f NotoSansGujarati-Regular.ttf
          test -f NotoSansGujarati-Bold.ttf

          mkdir -p cap/www/assets cap/www/lib cap/assets

          cp index.html cap/www/index.html
          cp NotoSansGujarati-Regular.ttf cap/www/assets/
          cp NotoSansGujarati-Bold.ttf cap/www/assets/
          cp native-shim.js cap/www/
          cp native-plugins-entry.js cap/
          cp capacitor.config.json cap/

          cp icon-only.png cap/assets/
          cp icon-foreground.png cap/assets/
          cp icon-background.png cap/assets/

          sed -i 's#../assets/NotoSansGujarati-#assets/NotoSansGujarati-#g' cap/www/index.html

          cd cap
          npm init -y

          npm install --no-audit --no-fund \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/filesystem@6 \
            @capacitor/share@6 \
            @capacitor/app@6 \
            html2canvas@1.4.1 \
            jspdf@2.5.1 \
            esbuild

          npm install --save-dev @capacitor/assets@3

          npx esbuild native-plugins-entry.js \
            --bundle --platform=browser --format=iife \
            --outfile=www/lib/native-plugins.js

          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/

          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          if "lib/native-plugins.js" not in s:
              scripts = (
                  '<script src="capacitor.js"></script>'
                  '<script src="lib/native-plugins.js"></script>'
                  '<script src="native-shim.js"></script>'
              )
              if "</head>" not in s:
                  raise SystemExit("ERROR: index.html has no closing head tag")
              s = s.replace("</head>", scripts + "</head>", 1)
              p.write_text(s, encoding="utf-8")
          PY

          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build test APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          cp cap/android/app/build/outputs/apk/debug/app-debug.apk PROTOCOL-SAKHA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: PROTOCOL-SAKHA.apk
          if-no-files-found: error
