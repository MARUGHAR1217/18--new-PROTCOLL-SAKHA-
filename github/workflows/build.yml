
name: Build PROTOCOL SAKHA APK and EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f package.json
          test -f capacitor.config.json
          test -f native-shim.js
          test -f native-plugins-entry.js
          test -f NotoSansGujarati-Regular.ttf
          test -f NotoSansGujarati-Bold.ttf
          test -f icon.png

          mkdir -p cap/www/assets cap/www/lib cap/assets

          cp index.html cap/www/index.html
          cp NotoSansGujarati-Regular.ttf NotoSansGujarati-Bold.ttf cap/www/assets/
          cp native-shim.js cap/www/
          cp icon.png icon-foreground.png icon-background.png cap/assets/
          cp capacitor.config.json native-plugins-entry.js cap/

          sed -i 's#../assets/NotoSansGujarati-#assets/NotoSansGujarati-#g' cap/www/index.html

          cd cap
          npm init -y

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6 --no-audit --no-fund
          npm install html2canvas@1.4.1 jspdf@2.5.1 esbuild --no-audit --no-fund

          npx esbuild native-plugins-entry.js --bundle --platform=browser --format=iife --outfile=www/lib/native-plugins.js

          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/

          if ! grep -q 'lib/native-plugins.js' www/index.html; then
            sed -i 's#</head>#<script src="capacitor.js"></script><script src="lib/native-plugins.js"></script><script src="native-shim.js"></script></head>#' www/index.html
          fi

          npm install --save-dev @capacitor/assets@3 --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path www, www/assets, build | Out-Null
          Copy-Item index.html www/index.html -Force
          Copy-Item NotoSansGujarati-Regular.ttf, NotoSansGujarati-Bold.ttf www/assets/ -Force
          Copy-Item icon.png build/icon.png -Force
          (Get-Content www/index.html -Raw).Replace('../assets/NotoSansGujarati-', 'assets/NotoSansGujarati-') | Set-Content www/index.html -NoNewline

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-EXE
          path: dist/PROTOCOL-SAKHA.exe
          if-no-files-found: error
